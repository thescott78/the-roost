<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <title>The Roost</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Roost">
    <style>
        :root {
            --bg: #1a1a1a;
            --fg: #ffffff;
            --muted: #888;
            --accent: #ff4500;
            --ring-1: #4a90e2;
            --ring-2: #00bcd4;
            --ring-3: #8bc34a;
            --ring-4: #ffc107;
            --ring-5: #ff5722;
            --ring-6: #ff1744;
        }
        body.night {
            --bg: #000;
            --fg: #ff2a2a;
            --muted: #992020;
            --accent: #ff2a2a;
            --ring-1: #3a0000;
            --ring-2: #550000;
            --ring-3: #770000;
            --ring-4: #990000;
            --ring-5: #cc0000;
            --ring-6: #ff2a2a;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        body {
            background: var(--bg); color: var(--fg);
            font-family: -apple-system, system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
            user-select: none; -webkit-user-select: none;
            transition: background 0.3s, color 0.3s;
        }
        body.arrived { animation: arrived-pulse 1.5s infinite; }
        @keyframes arrived-pulse { 0%, 100% { background: var(--bg); } 50% { background: #330a00; } }
        body.night.arrived { animation: none; }

        #topbar {
            width: 100%; display: flex; justify-content: space-between;
            padding: 12px 4px; font-size: 0.9rem;
        }
        .chip {
            background: transparent; color: var(--fg); border: 1px solid var(--muted);
            padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer;
        }

        #compass-wrap {
            position: relative; width: min(85vw, 380px); aspect-ratio: 1;
            display: flex; align-items: center; justify-content: center;
            margin-top: 8px;
        }
        .ring {
            position: absolute; border-radius: 50%; border: 2px solid;
            opacity: 0; pointer-events: none;
        }
        .ring.active { animation: pulse 2s ease-out infinite; }
        @keyframes pulse {
            0%   { transform: scale(0.4); opacity: 0.9; }
            100% { transform: scale(1.0); opacity: 0; }
        }
        #r1 { width: 100%; height: 100%; border-color: var(--ring-current, var(--ring-1)); animation-delay: 0s; }
        #r2 { width: 100%; height: 100%; border-color: var(--ring-current, var(--ring-1)); animation-delay: 0.66s; }
        #r3 { width: 100%; height: 100%; border-color: var(--ring-current, var(--ring-1)); animation-delay: 1.33s; }

        #arrow {
            width: 55%; height: 55%;
            transition: transform 0.15s ease-out;
            filter: drop-shadow(0 0 12px var(--ring-current, var(--accent)));
        }
        #arrow.stale { opacity: 0.35; }
        #arrow polygon { fill: var(--ring-current, var(--accent)); transition: fill 0.4s; }

        #distance {
            font-size: 3rem; font-weight: 800; margin-top: 18px;
            letter-spacing: -1px;
        }
        #distance.arrived { color: var(--ring-6) !important; }
        #meta {
            font-size: 0.9rem; color: var(--muted);
            margin-top: 4px; text-align: center;
        }
        #meta .warn { color: var(--ring-5); }
        #status {
            font-size: 0.75rem; color: var(--muted); margin-top: 6px;
            text-align: center; min-height: 1em;
        }

        #trail {
            position: fixed; inset: 0;
            width: 100vw; height: 100vh;
            pointer-events: none; z-index: 2;
        }
        #trail .trail-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
        #trail .you { transition: cx 0.2s linear, cy 0.2s linear; }

        /* layering — rings/arrow underneath, trail above them, UI on top */
        #compass-wrap { z-index: 1; }
        #topbar, #startBtn, #trackingDisplay, #quote, #controls {
            position: relative; z-index: 3;
        }

        /* Quote (no box) */
        #quote {
            margin: 22px auto 8px;
            padding: 0 18px;
            max-width: 560px;
            text-align: center;
            color: var(--fg);
            font-style: italic;
            line-height: 1.35;
            font-size: clamp(1rem, 4vw, 1.4rem);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.5s ease;
            min-height: 4.4em;
        }
        #quote.show { opacity: 0.92; }
        #quote .author {
            display: block;
            margin-top: 8px;
            font-style: normal;
            font-size: 0.85em;
            color: var(--muted);
        }

        #controls {
            display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: var(--accent); color: var(--bg);
            border: none; padding: 14px 22px; border-radius: 28px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
        }
        body.night .btn { background: var(--fg); color: #000; }
        .btn.secondary { background: transparent; color: var(--fg); border: 1px solid var(--muted); font-weight: 500; }
        .btn.stop { background: var(--ring-6); color: #fff; }
        body.night .btn.stop { background: var(--ring-6); color: #000; }
        .btn.glow { animation: stop-pulse 1.4s ease-in-out infinite; }
        @keyframes stop-pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,23,68,0.55); }
            50%     { box-shadow: 0 0 0 14px rgba(255,23,68,0); }
        }

        #arrivedActions { display: none; margin-top: 14px; text-align: center; }
        #arrivedActions.show { display: block; }
        #arrivedActions .btn { padding: 16px 28px; font-size: 1.05rem; }
        #arrivedActions .hint { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }

        #calib {
            position: fixed; left: 0; right: 0; bottom: 80px; margin: 0 auto;
            width: max-content; max-width: 90%;
            background: var(--ring-4); color: #000; padding: 10px 16px;
            border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            display: none;
        }
        #calib.show { display: block; }

        /* SOS modal */
        #sos {
            position: fixed; inset: 0; background: rgba(0,0,0,0.96);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; z-index: 10;
        }
        #sos.show { display: flex; }
        #sos h2 { font-size: 1.2rem; margin: 0 0 20px; color: var(--muted); font-weight: 500; }
        #sos .coord { font-size: 2.4rem; font-weight: 800; letter-spacing: 1px; margin: 6px 0; text-align: center; }
        #sos .label { font-size: 0.8rem; color: var(--muted); margin-top: 16px; }
        #sos .close { margin-top: 36px; }

        /* Destinations modal */
        #destModal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.96);
            display: none; flex-direction: column;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
            z-index: 10;
        }
        #destModal.show { display: flex; }
        #destModal h2 {
            font-size: 1.4rem; margin: 18px 4px 14px; color: var(--fg);
            font-weight: 700;
        }
        #destScroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        #destList { list-style: none; padding: 0; margin: 0 0 18px; }
        #destList li {
            display: flex; align-items: stretch; gap: 0;
            border: 1.5px solid var(--muted); border-radius: 14px;
            margin-bottom: 12px; overflow: hidden;
        }
        #destList li.active { border-color: var(--accent); background: rgba(255,69,0,0.1); }
        body.night #destList li.active { background: rgba(255,42,42,0.1); }
        #destList .row-select {
            flex: 1; display: flex; align-items: center; gap: 14px;
            padding: 18px 14px; background: transparent; border: none;
            color: var(--fg); cursor: pointer; min-height: 64px;
            font-family: inherit; text-align: left;
            -webkit-tap-highlight-color: rgba(255,69,0,0.2);
        }
        #destList .miniarrow {
            width: 38px; height: 38px; flex-shrink: 0;
            transition: transform 0.2s ease-out;
        }
        #destList .miniarrow polygon { fill: var(--accent); }
        #destList li.active .miniarrow polygon { fill: var(--ring-6); }
        #destList .info { flex-grow: 1; min-width: 0; }
        #destList .name { font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
        #destList .sub { font-size: 0.85rem; color: var(--muted); margin-top: 3px; }
        #destList .check {
            font-size: 1.4rem; color: var(--ring-6); margin-left: 8px;
            display: none;
        }
        #destList li.active .check { display: inline; }
        #destList .del {
            background: transparent; border: none; border-left: 1px solid var(--muted);
            color: var(--muted); cursor: pointer;
            min-width: 56px; font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            font-family: inherit;
            -webkit-tap-highlight-color: rgba(255,23,68,0.3);
        }
        #destList .del.confirm {
            background: var(--ring-6); color: #fff; font-size: 0.85rem;
            font-weight: 700; padding: 0 10px;
        }

        #addForm {
            border: 1.5px solid var(--muted);
            border-radius: 14px;
            padding: 18px 16px 16px;
            margin-top: 18px;
            background: rgba(255,255,255,0.025);
        }
        body.night #addForm { background: rgba(255,42,42,0.05); }
        #addForm h3 { margin: 0 0 12px; font-size: 1.05rem; color: var(--fg); font-weight: 600; }
        #addForm input {
            width: 100%; padding: 16px; background: transparent;
            color: var(--fg); border: 1.5px solid var(--muted); border-radius: 10px;
            font-size: 1rem; margin-bottom: 10px; font-family: inherit;
        }
        #addForm input:focus { outline: none; border-color: var(--accent); }
        #addForm .latlon { display: flex; gap: 8px; }
        #addForm .latlon input { flex: 1; }
        #addForm .btn { width: 100%; padding: 16px; font-size: 1.05rem; margin-top: 4px; }
        #addError { color: var(--ring-5); font-size: 0.9rem; min-height: 1.2em; margin: 4px 0 8px; }

        #manualToggle {
            background: transparent; border: none; color: var(--muted);
            font-size: 0.95rem; padding: 12px 0; cursor: pointer;
            text-align: center; width: 100%;
            font-family: inherit; text-decoration: underline;
            -webkit-tap-highlight-color: transparent;
        }
        #manualFields { display: none; }
        #manualFields.show { display: block; }

        #closeDest {
            width: 100%; padding: 18px; font-size: 1.1rem; margin: 14px 0 4px;
        }

        /* idle vs tracking state */
        #startBtn.huge {
            margin: 28px auto 0; padding: 22px 44px;
            font-size: 1.4rem; font-weight: 800;
            box-shadow: 0 0 40px rgba(255,69,0,0.35);
            display: block;
        }
        body.tracking #startBtn.huge { display: none; }
        body:not(.tracking) #trackingDisplay,
        body:not(.tracking) #trail,
        body:not(.tracking) #stopBtn { display: none; }
        body.tracking #trackingDisplay { display: block; text-align: center; width: 100%; }

        /* confetti */
        .confetti {
            position: fixed; top: -10px; width: 10px; height: 14px;
            will-change: transform; pointer-events: none; z-index: 5;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }
    </style>
</head>
<body>

<svg id="trail" preserveAspectRatio="none" aria-hidden="true"></svg>

<div id="topbar">
    <button class="chip" id="nightBtn">Night</button>
    <button class="chip" id="sosBtn">Where am I?</button>
</div>

<div id="compass-wrap">
    <div class="ring" id="r1"></div>
    <div class="ring" id="r2"></div>
    <div class="ring" id="r3"></div>
    <svg id="arrow" viewBox="0 0 100 100">
        <polygon points="50,5 95,95 50,75 5,95" />
    </svg>
</div>

<button class="btn huge" id="startBtn" type="button">Start Compass</button>

<div id="trackingDisplay">
    <div id="distance">Finding Camp…</div>
    <div id="meta"><span id="accuracy"></span><span id="eta"></span></div>
    <div id="status"></div>
    <div id="arrivedActions">
        <button class="btn stop glow" id="stopFromArrival" type="button">⚡ Stop GPS · Save battery</button>
        <div class="hint">You're home — tracking off saves your phone</div>
    </div>
</div>

<div id="quote" role="button" tabindex="0" aria-label="Tap for next quote"></div>

<div id="controls">
    <button class="btn stop" id="stopBtn" type="button">Stop</button>
    <button class="btn secondary" id="destBtn" type="button">Destinations</button>
</div>

<div id="calib">📱 Wave phone in a figure-8 to calibrate compass</div>

<div id="sos">
    <h2>Read these to camp radio</h2>
    <div class="label">Latitude</div>
    <div class="coord" id="sosLat">—</div>
    <div class="label">Longitude</div>
    <div class="coord" id="sosLon">—</div>
    <div class="label" id="sosAcc"></div>
    <button class="btn close" id="sosClose">Close</button>
</div>

<div id="destModal">
    <h2>Destinations</h2>
    <div id="destScroll">
        <ul id="destList"></ul>
        <div id="addForm">
            <h3>Add new</h3>
            <input id="newName" type="text" placeholder="Name (e.g. Stone Circle)" maxlength="40">
            <div id="addError"></div>
            <button class="btn" id="captureGpsBtn">📍 Save with current GPS</button>
            <button id="manualToggle" type="button">Or enter coordinates manually ▾</button>
            <div id="manualFields">
                <div class="latlon">
                    <input id="newLat" type="text" inputmode="decimal" placeholder="Latitude">
                    <input id="newLon" type="text" inputmode="decimal" placeholder="Longitude">
                </div>
                <button class="btn secondary" id="saveDestBtn">Save coordinates</button>
            </div>
        </div>
    </div>
    <button class="btn secondary" id="closeDest" type="button">Close</button>
</div>

<script>
(() => {
    const DEFAULT_LOCATIONS = [
        { id: 'base', name: 'Base Camp', lat: -32.517363, lon: 19.949305 }
    ];

    let locations, activeId;
    function loadState() {
        try {
            const raw = JSON.parse(localStorage.getItem('roost-data') || 'null');
            if (raw && Array.isArray(raw.locations) && raw.locations.length) {
                locations = raw.locations;
                activeId = raw.activeId && locations.find(l => l.id === raw.activeId)
                    ? raw.activeId : locations[0].id;
                return;
            }
        } catch {}
        locations = DEFAULT_LOCATIONS.slice();
        // migrate legacy single-camp storage
        const legacy = JSON.parse(localStorage.getItem('camp') || 'null');
        if (legacy && typeof legacy.lat === 'number' && typeof legacy.lon === 'number') {
            const sameAsBase = Math.abs(legacy.lat - DEFAULT_LOCATIONS[0].lat) < 1e-5 &&
                               Math.abs(legacy.lon - DEFAULT_LOCATIONS[0].lon) < 1e-5;
            if (!sameAsBase) {
                locations.push({ id: 'legacy', name: 'My Camp', lat: legacy.lat, lon: legacy.lon });
            }
        }
        activeId = locations[0].id;
        saveState();
    }
    function saveState() {
        localStorage.setItem('roost-data', JSON.stringify({ locations, activeId }));
    }
    function activeLocation() {
        return locations.find(l => l.id === activeId) || locations[0];
    }
    loadState();

    let userLat = null, userLon = null, userAcc = null;
    let deviceHeading = null;
    let compassAccuracy = null; // degrees, -1 = unreliable (iOS)
    let lastFix = 0;
    let speedSamples = []; // {t, lat, lon}
    let trailPoints = [];  // last N {lat, lon}
    const TRAIL_MAX = 60;
    let hapticTimer = null;
    let lastHapticInterval = 0;
    let arrived = false;

    // Quotes — placeholder until user supplies the array
    const QUOTES = [
        { text: "Not all those who wander are lost.", author: "J.R.R. Tolkien" },
        { text: "Wherever you go, there you are.", author: "Jon Kabat-Zinn" },
        { text: "The desert tells a different story every time one ventures on it.", author: "Robert Edison Fulton Jr." }
    ];
    let quoteIndex = -1;
    let quoteTimer = null;
    let lastQuoteShown = 0;

    const $ = (id) => document.getElementById(id);

    function showRandomQuote() {
        if (!QUOTES.length) return;
        const el = $('quote');
        let next;
        // pick a quote different from current
        do { next = Math.floor(Math.random() * QUOTES.length); }
        while (QUOTES.length > 1 && next === quoteIndex);
        quoteIndex = next;
        const q = QUOTES[quoteIndex];

        // fade out -> swap -> fade in
        el.classList.remove('show');
        setTimeout(() => {
            el.innerHTML = '';
            const t = document.createTextNode('“' + q.text + '”');
            el.appendChild(t);
            if (q.author) {
                const a = document.createElement('span');
                a.className = 'author';
                a.textContent = '— ' + q.author;
                el.appendChild(a);
            }
            el.classList.add('show');
            lastQuoteShown = Date.now();
        }, 350);
    }

    function startQuoteRotation() {
        showRandomQuote();
        if (quoteTimer) clearInterval(quoteTimer);
        quoteTimer = setInterval(showRandomQuote, 30000);
    }

    const toRad = (d) => d * Math.PI / 180;
    const toDeg = (r) => r * 180 / Math.PI;

    function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat/2)**2 +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function bearing(lat1, lon1, lat2, lon2) {
        const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
        const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                  Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
        return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    // Color zones by distance (meters)
    function zoneFor(dist) {
        if (dist > 1000) return { name: '1', color: 'var(--ring-1)', pulse: 2.4, hap: 0 };
        if (dist > 500)  return { name: '2', color: 'var(--ring-2)', pulse: 2.0, hap: 2500 };
        if (dist > 200)  return { name: '3', color: 'var(--ring-3)', pulse: 1.6, hap: 1500 };
        if (dist > 75)   return { name: '4', color: 'var(--ring-4)', pulse: 1.2, hap: 800 };
        if (dist > 25)   return { name: '5', color: 'var(--ring-5)', pulse: 0.8, hap: 400 };
        return               { name: '6', color: 'var(--ring-6)', pulse: 0.5, hap: 180 };
    }

    function setHaptic(intervalMs) {
        if (intervalMs === lastHapticInterval) return;
        lastHapticInterval = intervalMs;
        if (hapticTimer) { clearInterval(hapticTimer); hapticTimer = null; }
        if (!intervalMs || !navigator.vibrate) return;
        hapticTimer = setInterval(() => navigator.vibrate(60), intervalMs);
    }

    function formatDist(m) {
        return m >= 1000 ? (m/1000).toFixed(2) + ' km' : Math.round(m) + ' m';
    }

    // Smooth speed estimate from recent fixes (m/s)
    function estimateSpeed() {
        if (speedSamples.length < 2) return 0;
        const now = speedSamples[speedSamples.length - 1];
        const then = speedSamples[0];
        const dt = (now.t - then.t) / 1000;
        if (dt < 2) return 0;
        const d = haversine(then.lat, then.lon, now.lat, now.lon);
        return d / dt;
    }

    function updateTrail() {
        const svg = $('trail');
        [...svg.querySelectorAll('.tp')].forEach(n => n.remove());
        if (!trailPoints.length) return;

        const w = window.innerWidth;
        const h = window.innerHeight;
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        svg.setAttribute('width', w);
        svg.setAttribute('height', h);

        // Destination = visual center of the arrow (center of compass-wrap)
        const wrapRect = $('compass-wrap').getBoundingClientRect();
        const cx = wrapRect.left + wrapRect.width / 2;
        const cy = wrapRect.top + wrapRect.height / 2;
        // Pick the smaller distance from arrow-center to nearest viewport edge
        // so the user-dot can reach an edge in any direction without overshooting.
        const edge = Math.max(
            40,
            Math.min(cx, cy, w - cx, h - cy) - 20
        );

        const tgt = activeLocation();
        const latRad = toRad(tgt.lat);
        const mPerDegLat = 111320;
        const mPerDegLon = 111320 * Math.cos(latRad);

        let maxR = 1;
        const projected = trailPoints.map(p => {
            const x = (p.lon - tgt.lon) * mPerDegLon;
            const y = -(p.lat - tgt.lat) * mPerDegLat; // north up
            const r = Math.hypot(x, y);
            if (r > maxR) maxR = r;
            return { x, y };
        });

        const scale = edge / maxR;
        const ns = 'http://www.w3.org/2000/svg';
        const pts = projected.map(p =>
            `${(cx + p.x*scale).toFixed(1)},${(cy + p.y*scale).toFixed(1)}`
        ).join(' ');

        const poly = document.createElementNS(ns, 'polyline');
        poly.setAttribute('points', pts);
        poly.setAttribute('class', 'trail-line tp');
        poly.setAttribute('stroke', 'var(--ring-current, #ff4500)');
        svg.appendChild(poly);

        const last = projected[projected.length - 1];
        const you = document.createElementNS(ns, 'circle');
        you.setAttribute('cx', (cx + last.x*scale).toFixed(1));
        you.setAttribute('cy', (cy + last.y*scale).toFixed(1));
        you.setAttribute('r', '6');
        you.setAttribute('fill', 'var(--ring-current, #ff4500)');
        you.setAttribute('class', 'tp you');
        svg.appendChild(you);
    }

    window.addEventListener('resize', () => updateTrail());

    function celebrate() {
        if (arrived) return;
        arrived = true;
        document.body.classList.add('arrived');
        $('distance').classList.add('arrived');
        $('distance').textContent = "You're home!";
        updateTrackingUI();
        if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
        for (let i = 0; i < 50; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            const colors = ['#ff4500','#ffc107','#8bc34a','#00bcd4','#ff1744'];
            c.style.background = colors[i % colors.length];
            c.style.animation = `fall ${2 + Math.random()*2}s linear ${Math.random()*0.8}s forwards`;
            c.style.transform = `rotate(${Math.random()*360}deg)`;
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 5000);
        }
    }

    function unCelebrate() {
        arrived = false;
        document.body.classList.remove('arrived');
        $('distance').classList.remove('arrived');
        updateTrackingUI();
    }

    function updateUI() {
        if (userLat == null) return;

        const tgt = activeLocation();
        const dist = haversine(userLat, userLon, tgt.lat, tgt.lon);
        const brg = bearing(userLat, userLon, tgt.lat, tgt.lon);
        const zone = zoneFor(dist);

        document.documentElement.style.setProperty('--ring-current', zone.color);

        // Rings pulse speed
        ['r1','r2','r3'].forEach(id => {
            const el = $(id);
            el.classList.add('active');
            el.style.animationDuration = zone.pulse + 's';
        });

        // Arrow rotation: bearing - heading. If no heading, arrow points "up" as if facing north.
        const heading = deviceHeading ?? 0;
        const screenAngle = (screen.orientation && screen.orientation.angle) || 0;
        const rotation = brg - heading + screenAngle;
        const arrow = $('arrow');
        arrow.style.transform = `rotate(${rotation}deg)`;
        arrow.classList.toggle('stale', deviceHeading == null);

        // Distance with hysteresis so confetti doesn't retrigger on wobble
        if (dist <= 15 && !arrived) {
            celebrate();
        } else if (dist > 30 && arrived) {
            unCelebrate();
            $('distance').textContent = formatDist(dist);
        } else if (!arrived) {
            $('distance').textContent = formatDist(dist);
        }

        // Accuracy + ETA
        let accText = '';
        if (userAcc != null) {
            const warn = userAcc > 30 ? ' warn' : '';
            accText = `<span class="${warn.trim()}">±${Math.round(userAcc)}m</span>`;
        }
        const speed = estimateSpeed();
        let etaText = '';
        if (speed > 0.3 && dist > 15) {
            const eta = dist / speed;
            if (eta < 3600) {
                const mins = Math.max(1, Math.round(eta / 60));
                etaText = ` · ~${mins} min`;
            }
        }
        $('accuracy').innerHTML = accText;
        $('eta').innerHTML = etaText;

        // Status
        const heads = deviceHeading == null ? 'no compass' : `heading ${Math.round(heading)}°`;
        $('status').textContent = `GPS ${userLat.toFixed(5)}, ${userLon.toFixed(5)} · ${heads}`;

        // Haptics
        setHaptic(zone.hap);

        // Calibration warning
        const badCompass = compassAccuracy === -1 || (compassAccuracy != null && compassAccuracy > 25);
        $('calib').classList.toggle('show', badCompass);

        updateTrail();

        if ($('destModal').classList.contains('show')) {
            renderDestList();
        }
    }

    function onPosition(pos) {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        userAcc = pos.coords.accuracy;
        lastFix = Date.now();

        const sample = { t: lastFix, lat: userLat, lon: userLon };
        speedSamples.push(sample);
        // keep ~30s of samples
        while (speedSamples.length > 1 && lastFix - speedSamples[0].t > 30000) speedSamples.shift();

        const lastPt = trailPoints[trailPoints.length - 1];
        if (!lastPt || haversine(lastPt.lat, lastPt.lon, userLat, userLon) > 3) {
            trailPoints.push({ lat: userLat, lon: userLon });
            if (trailPoints.length > TRAIL_MAX) trailPoints.shift();
        }

        if (pendingCapture) {
            const p = pendingCapture;
            pendingCapture = null;
            clearTimeout(p.timeoutId);
            saveCurrentGpsAsDest(p.name);
        }

        updateUI();
    }

    function onPositionError(err) {
        $('status').textContent = 'GPS error: ' + err.message;
    }

    function handleOrientation(event) {
        if (event.webkitCompassHeading != null) {
            deviceHeading = event.webkitCompassHeading;
            compassAccuracy = event.webkitCompassAccuracy;
        } else if (event.absolute === true && event.alpha != null) {
            deviceHeading = (360 - event.alpha) % 360;
            compassAccuracy = null;
        } else if (event.alpha != null && deviceHeading == null) {
            // Non-absolute fallback — heading is unreliable but better than nothing
            deviceHeading = (360 - event.alpha) % 360;
            compassAccuracy = 45; // flag as low confidence
        } else if (event.alpha != null) {
            deviceHeading = (360 - event.alpha) % 360;
        }
        updateUI();
    }

    let gpsStarted = false;
    let watchId = null;
    let staleWatchdog = null;
    let orientationListenersAdded = false;
    let pendingCapture = null; // {name, timeoutId} when waiting for first fix to save a dest
    let gpsStartedForModal = false; // GPS was auto-started for the destinations modal preview

    function addOrientationListeners() {
        if (orientationListenersAdded) return;
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        window.addEventListener('deviceorientation', handleOrientation, true);
        orientationListenersAdded = true;
    }
    function removeOrientationListeners() {
        if (!orientationListenersAdded) return;
        window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
        window.removeEventListener('deviceorientation', handleOrientation, true);
        orientationListenersAdded = false;
    }

    function startGps() {
        if (gpsStarted) return true;
        if (!navigator.geolocation) {
            $('status').textContent = 'No geolocation on this device';
            return false;
        }
        watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
            enableHighAccuracy: true,
            maximumAge: 2000,
            timeout: 20000
        });
        gpsStarted = true;
        staleWatchdog = setInterval(() => {
            if (lastFix && Date.now() - lastFix > 15000) {
                $('arrow').classList.add('stale');
            }
        }, 3000);
        $('meta').innerHTML = '<span id="accuracy"></span><span id="eta"></span>';
        $('arrow').classList.remove('stale');
        updateTrackingUI();
        return true;
    }

    function stopGps() {
        if (!gpsStarted) return;
        if (watchId != null) {
            try { navigator.geolocation.clearWatch(watchId); } catch {}
        }
        watchId = null;
        if (staleWatchdog) { clearInterval(staleWatchdog); staleWatchdog = null; }
        setHaptic(0);
        removeOrientationListeners();
        if (pendingCapture) {
            clearTimeout(pendingCapture.timeoutId);
            pendingCapture = null;
            $('captureGpsBtn').textContent = '📍 Save with current GPS';
            $('captureGpsBtn').disabled = false;
        }
        gpsStarted = false;
        deviceHeading = null;
        compassAccuracy = null;
        userLat = null; userLon = null; userAcc = null;
        speedSamples = [];
        ['r1','r2','r3'].forEach(id => $(id).classList.remove('active'));
        $('arrow').classList.add('stale');
        document.body.classList.remove('arrived');
        $('distance').classList.remove('arrived');
        if (arrived) {
            $('distance').textContent = "You're home";
        }
        $('meta').innerHTML = '<span>🔋 GPS off — saving battery</span>';
        $('status').textContent = 'Tap Start to resume tracking';
        updateTrackingUI();
    }

    async function startCompass() {
        if (gpsStarted) return;
        $('status').textContent = 'Requesting permissions…';

        // iOS 13+ orientation permission
        try {
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                const resp = await DeviceOrientationEvent.requestPermission();
                if (resp !== 'granted') $('status').textContent = 'Compass denied';
            }
        } catch (e) { /* ignore */ }

        addOrientationListeners();
        startGps();
    }

    function updateTrackingUI() {
        document.body.classList.toggle('tracking', gpsStarted);
        $('arrivedActions').classList.toggle('show', arrived && gpsStarted);
    }

    // Buttons
    $('startBtn').addEventListener('click', startCompass);
    $('stopBtn').addEventListener('click', stopGps);
    $('stopFromArrival').addEventListener('click', stopGps);

    $('nightBtn').addEventListener('click', () => {
        document.body.classList.toggle('night');
        const night = document.body.classList.contains('night');
        localStorage.setItem('night', night ? '1' : '0');
        $('nightBtn').textContent = night ? 'Day' : 'Night';
    });
    if (localStorage.getItem('night') === '1') {
        document.body.classList.add('night');
        $('nightBtn').textContent = 'Day';
    }

    $('quote').addEventListener('click', () => {
        // Tap-to-cycle, but reset 30s timer so it doesn't change again right after a tap
        if (quoteTimer) clearInterval(quoteTimer);
        showRandomQuote();
        quoteTimer = setInterval(showRandomQuote, 30000);
    });
    startQuoteRotation();

    // ---- Destinations modal ----
    let pendingDeleteId = null;
    let pendingDeleteTimeout = null;

    function renderDestList() {
        const ul = $('destList');
        ul.innerHTML = '';
        const ns = 'http://www.w3.org/2000/svg';
        const heading = deviceHeading ?? 0;
        const screenAngle = (screen.orientation && screen.orientation.angle) || 0;

        for (const loc of locations) {
            const li = document.createElement('li');
            li.dataset.id = loc.id;
            if (loc.id === activeId) li.classList.add('active');

            const select = document.createElement('button');
            select.className = 'row-select';
            select.type = 'button';

            const svg = document.createElementNS(ns, 'svg');
            svg.setAttribute('viewBox', '0 0 100 100');
            svg.setAttribute('class', 'miniarrow');
            const poly = document.createElementNS(ns, 'polygon');
            poly.setAttribute('points', '50,5 95,95 50,75 5,95');
            svg.appendChild(poly);

            const info = document.createElement('div');
            info.className = 'info';
            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = loc.name;
            const sub = document.createElement('div');
            sub.className = 'sub';

            if (userLat != null) {
                const d = haversine(userLat, userLon, loc.lat, loc.lon);
                const b = bearing(userLat, userLon, loc.lat, loc.lon);
                svg.style.transform = `rotate(${b - heading + screenAngle}deg)`;
                sub.textContent = (d >= 1000 ? (d/1000).toFixed(2) + ' km' : Math.round(d) + ' m');
            } else {
                svg.style.opacity = '0.3';
                sub.textContent = `${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}`;
            }
            info.appendChild(name);
            info.appendChild(sub);

            const check = document.createElement('span');
            check.className = 'check';
            check.textContent = '✓';

            select.appendChild(svg);
            select.appendChild(info);
            select.appendChild(check);
            select.addEventListener('click', () => selectLocation(loc.id));

            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'del' + (pendingDeleteId === loc.id ? ' confirm' : '');
            del.textContent = pendingDeleteId === loc.id ? 'Sure?' : '×';
            del.setAttribute('aria-label', 'Delete');
            del.addEventListener('click', (e) => {
                e.stopPropagation();
                handleDeleteTap(loc.id);
            });

            li.appendChild(select);
            li.appendChild(del);
            ul.appendChild(li);
        }
    }

    function selectLocation(id) {
        // Picking a destination is a commitment to navigate, so keep GPS on
        gpsStartedForModal = false;
        if (id === activeId) {
            $('destModal').classList.remove('show');
            return;
        }
        activeId = id;
        saveState();
        unCelebrate();
        clearPendingDelete();
        renderDestList();
        updateUI();
        $('destModal').classList.remove('show');
    }

    function handleDeleteTap(id) {
        if (locations.length <= 1) {
            setAddError("Can't delete the last destination");
            return;
        }
        if (pendingDeleteId === id) {
            clearPendingDelete();
            deleteLocation(id);
        } else {
            clearPendingDelete();
            pendingDeleteId = id;
            pendingDeleteTimeout = setTimeout(() => {
                pendingDeleteId = null;
                renderDestList();
            }, 3000);
            renderDestList();
        }
    }

    function clearPendingDelete() {
        if (pendingDeleteTimeout) { clearTimeout(pendingDeleteTimeout); pendingDeleteTimeout = null; }
        pendingDeleteId = null;
    }

    function deleteLocation(id) {
        const i = locations.findIndex(l => l.id === id);
        if (i < 0) return;
        locations.splice(i, 1);
        if (activeId === id) {
            activeId = locations[0].id;
            unCelebrate();
        }
        saveState();
        renderDestList();
        updateUI();
    }

    function setAddError(msg) {
        $('addError').textContent = msg || '';
    }

    function newId() {
        return 'loc-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
    }

    function parseCoord(s, min, max) {
        if (!s) return NaN;
        const n = parseFloat(s.trim());
        if (!isFinite(n) || n < min || n > max) return NaN;
        return n;
    }

    function validateName() {
        const name = $('newName').value.trim();
        if (!name) { setAddError('Name is required'); return null; }
        if (locations.some(l => l.name.toLowerCase() === name.toLowerCase())) {
            setAddError('That name is already used'); return null;
        }
        return name;
    }

    function commitNewLocation(name, lat, lon) {
        const loc = { id: newId(), name, lat, lon };
        locations.push(loc);
        activeId = loc.id;
        // Saving a destination commits to tracking — don't auto-stop on close
        gpsStartedForModal = false;
        saveState();
        $('newName').value = '';
        $('newLat').value = '';
        $('newLon').value = '';
        $('manualFields').classList.remove('show');
        $('manualToggle').textContent = 'Or enter coordinates manually ▾';
        setAddError('');
        unCelebrate();
        renderDestList();
        updateUI();
        $('captureGpsBtn').textContent = '📍 Save with current GPS';
        $('captureGpsBtn').disabled = false;
    }

    function saveCurrentGpsAsDest(name) {
        commitNewLocation(name, userLat, userLon);
    }

    function saveManualDest() {
        setAddError('');
        const name = validateName();
        if (!name) return;
        const lat = parseCoord($('newLat').value, -90, 90);
        const lon = parseCoord($('newLon').value, -180, 180);
        if (isNaN(lat) || isNaN(lon)) {
            setAddError('Enter valid lat/lon (or use current GPS above)');
            return;
        }
        commitNewLocation(name, lat, lon);
    }

    function captureGps() {
        setAddError('');
        const name = validateName();
        if (!name) return;

        if (userLat != null) {
            saveCurrentGpsAsDest(name);
            return;
        }

        if (!startGps()) {
            setAddError('Geolocation unavailable on this device');
            return;
        }

        // Wait for first fix, with timeout
        $('captureGpsBtn').textContent = 'Getting GPS fix…';
        $('captureGpsBtn').disabled = true;
        if (pendingCapture) clearTimeout(pendingCapture.timeoutId);
        pendingCapture = {
            name,
            timeoutId: setTimeout(() => {
                pendingCapture = null;
                $('captureGpsBtn').textContent = '📍 Save with current GPS';
                $('captureGpsBtn').disabled = false;
                setAddError('GPS timed out — check location permission');
            }, 30000)
        };
    }

    $('destBtn').addEventListener('click', () => {
        setAddError('');
        clearPendingDelete();
        // Auto-start GPS so the per-row arrows + distances are live.
        // Track that we started it for the modal so we can shut it back off
        // if the user leaves without picking or saving anything.
        if (!gpsStarted) {
            gpsStartedForModal = true;
            startCompass();
        }
        renderDestList();
        $('destModal').classList.add('show');
    });
    $('closeDest').addEventListener('click', () => {
        clearPendingDelete();
        if (pendingCapture) {
            clearTimeout(pendingCapture.timeoutId);
            pendingCapture = null;
            $('captureGpsBtn').textContent = '📍 Save with current GPS';
            $('captureGpsBtn').disabled = false;
        }
        $('destModal').classList.remove('show');
        if (gpsStartedForModal) {
            gpsStartedForModal = false;
            stopGps();
        }
    });
    $('captureGpsBtn').addEventListener('click', captureGps);
    $('saveDestBtn').addEventListener('click', saveManualDest);
    $('manualToggle').addEventListener('click', () => {
        const panel = $('manualFields');
        const showing = panel.classList.toggle('show');
        $('manualToggle').textContent = showing
            ? 'Hide manual entry ▴'
            : 'Or enter coordinates manually ▾';
        if (showing) $('newLat').focus();
    });

    $('sosBtn').addEventListener('click', () => {
        $('sosLat').textContent = userLat != null ? userLat.toFixed(6) : 'No GPS';
        $('sosLon').textContent = userLon != null ? userLon.toFixed(6) : 'No GPS';
        $('sosAcc').textContent = userAcc != null ? `Accuracy ±${Math.round(userAcc)}m` : '';
        $('sos').classList.add('show');
    });
    $('sosClose').addEventListener('click', () => $('sos').classList.remove('show'));

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
})();
</script>
</body>
</html>
